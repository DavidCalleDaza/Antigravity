# ============================================
# Servinow Backend — Render Blueprint
# ============================================
# Docs: https://docs.render.com/blueprint-spec

services:
  - type: web
    name: servinow-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        sync: false  # Set manually in Render dashboard
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: CORS_ORIGINS
        sync: false  # Set manually with your Vercel URL
      - key: FRONTEND_URL
        sync: false  # Set manually with your Vercel URL
      - key: META_APP_ID
        sync: false  # Configurar manualmente en Render con el App ID de Meta
      - key: META_APP_SECRET
        sync: false  # Configurar manualmente en Render con el App Secret de Meta (sensible)
      - key: META_REDIRECT_URI
        sync: false  # https://<tu-dominio-render>.onrender.com/api/v1/social/callback/facebook
      - key: META_API_VERSION
        value: v21.0
      - key: TIKTOK_CLIENT_KEY
        sync: false  # Configurar manualmente en Render con el Client Key de TikTok
      - key: TIKTOK_CLIENT_SECRET
        sync: false  # Configurar manualmente en Render con el Client Secret de TikTok (sensible)
      - key: TIKTOK_REDIRECT_URI
        sync: false  # https://<tu-dominio-render>.onrender.com/api/v1/social/callback/tiktok
      - key: APP_NAME
        value: Servinow API
      - key: APP_VERSION
        value: 0.1.0
      - key: DEBUG
        value: "False"
      - key: ENVIRONMENT
        value: production
