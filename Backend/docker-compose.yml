# ============================================
# DonApp Backend - Docker Compose (Local Dev)
# ============================================
version: "3.9"

services:
  # --- PostgreSQL Database ---
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-servinow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME_LOCAL_ONLY}
      POSTGRES_DB: ${POSTGRES_DB:-servinow_db}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-servinow_user} -d ${POSTGRES_DB:-servinow_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- FastAPI Application ---
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: sh ./entrypoint.sh
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

  # --- Redis (Message Broker) ---
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  # --- Celery Worker ---
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - db
      - redis

  # --- Flower (Celery UI) ---
  flower:
    image: mher/flower
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
    ports:
      - "5555:5555"
    depends_on:
      - redis

volumes:
  postgres_data:
    driver: local
