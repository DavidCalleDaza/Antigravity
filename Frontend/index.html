<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="DonApp - Gestor de productos y servicios para negocios que sirven. Facturación, estadísticas y marketing en un solo lugar.">
    <link rel="icon" type="image/png" href="/assets/logo-mark-black.png" />
    <link rel="shortcut icon" type="image/png" href="/assets/logo-mark-black.png" />
    <link rel="apple-touch-icon" href="/assets/logo-mark-black.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Uncial+Antiqua&family=Almendra+SC&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <title>DonApp — Servir es el único negocio donde todos ganan</title>
  </head>
  <body>
    <div id="root"></div>

    <!-- Eruda: consola de depuración para iOS/móvil (?debug=true o donapp_debug en localStorage) -->
    <!-- Se carga ANTES de React para capturar errores de bootstrap del bundle -->
    <script>
      (function() {
        try {
          var debug = new URLSearchParams(window.location.search).get('debug') === 'true'
                   || localStorage.getItem('donapp_debug') === 'true';
          if (debug) {
            localStorage.setItem('donapp_debug', 'true');
            var s = document.createElement('script');
            s.src = 'https://cdn.jsdelivr.net/npm/eruda';
            s.onload = function() { if (window.eruda) window.eruda.init(); };
            document.head.appendChild(s);
          }
        } catch(e) { /* localStorage bloqueado en modo privado */ }
      })();
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
